# CI on GitHub's own runners (free for a public repo).
#
# A pull request: `pnpm verify` (format, lint, types, unit, knip, build,
# e2e). A ruleset on main requires it; after Alec's go-ahead the PR's
# thread turns on auto-merge, and GitHub squash-merges once it passes.
# Deploys run in Cloudflare Workers Builds on each push to main, not here.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      # A high or critical advisory in what ships stops the run early.
      - name: Audit
        run: pnpm audit --prod --audit-level high
      - name: Verify
        run: pnpm verify
      # Playwright's report and traces, to see why an e2e test failed.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
