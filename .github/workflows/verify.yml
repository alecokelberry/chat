# CI on GitHub's own runners (free and unlimited for a public repo).
#
# The checks run side by side, so a PR waits for the slowest one, not all
# of them in a row:
#
#   check ──────────┐  format, lint, types, knip, audit, build, worker size,
#                   │  D1 backup
#   unit ───────────┤  Vitest (pnpm test)
#   e2e 1/3 ────────┤  Playwright, a third of the tests each, on the
#   e2e 2/3 ────────┤  mock model
#   e2e 3/3 ────────┤
#   burn-in ────────┤  PRs only: each spec file the PR adds or changes, 3
#                   │  more times, so a new flake fails here, not later
#                   └─► verify: passes only if every job above passed
#
# The ruleset on main requires `verify` alone, so jobs can be added or
# split here without touching it. After Alec's go the PR's thread turns
# on auto-merge, and GitHub squash-merges once it passes. When e2e fails,
# `report` merges the shards' reports into one (artifact playwright-report).
# Deploys run in Cloudflare Workers Builds on each push to main, not here.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # A high or critical advisory in what ships stops the run.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check
      - run: pnpm exec knip
      - run: pnpm build
      - run: node scripts/worker-size.mjs
      # The backup still works: a new virtual table once broke it (#234).
      - run: pnpm exec wrangler d1 migrations apply chat --local && pnpm db:export --local

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: true
      - run: pnpm e2e --shard=${{ matrix.shard }}/3
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
          if-no-files-found: ignore

  # Each spec file the PR adds or changes, run 3 more times. Playwright's
  # own --only-changed would also rerun every spec that imports a changed
  # file (e2e/session.ts reaches them all), so the list comes from git.
  burn-in:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the changed spec files
        id: specs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          SPECS=$(git diff --name-only --diff-filter=d "$BASE"...HEAD -- 'e2e/*.spec.ts' | tr '\n' ' ')
          echo "Changed specs: ${SPECS:-none}"
          echo "list=$SPECS" >> "$GITHUB_OUTPUT"
      - if: steps.specs.outputs.list != ''
        uses: ./.github/actions/setup
        with:
          browser: true
      - if: steps.specs.outputs.list != ''
        env:
          SPECS: ${{ steps.specs.outputs.list }}
        # SPECS is a space-separated list of paths, split on purpose.
        run: pnpm e2e --repeat-each=3 --reporter=github,list $SPECS
      # What a failed screenshot test drew (its *-actual.png), to look at or
      # to copy over a baseline (e2e/screenshots.spec.ts).
      - if: failure() && steps.specs.outputs.list != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burn-in-test-results
          path: test-results
          retention-days: 3
          if-no-files-found: ignore

  report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The one check the ruleset requires. It runs even when a job above
  # failed or was cancelled, so that it fails instead of being skipped (a
  # skipped required check would count as passing).
  verify:
    needs: [check, unit, e2e, burn-in]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A job above didn't pass."; exit 1
          fi
